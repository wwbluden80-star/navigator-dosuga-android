name: Android Native CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle.kts"
      - "gradle.properties"
      - "tools/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle.kts"
      - "gradle.properties"
      - "tools/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install screenshot verifier
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Static source and data QA
        run: python3 tools/static_qa.py

      - name: Unit tests and Android lint
        run: ./gradlew --stacktrace :app:testDebugUnitTest :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Inspect APK manifest, signature, and Room schema
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | tee app/build/outputs/apk/debug/apk-badging.txt
          grep -F "package: name='ru.navigatordosuga.app.debug' versionCode='4' versionName='1.2.0-debug'" app/build/outputs/apk/debug/apk-badging.txt
          grep -F "launchable-activity: name='ru.navigatordosuga.app.MainActivity'" app/build/outputs/apk/debug/apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ROOM_SCHEMA="$(find app/schemas -name '*.json' -print -quit)"
          test -n "$ROOM_SCHEMA"
          python3 - "$ROOM_SCHEMA" <<'PY'
          import json
          import sys

          schema = json.load(open(sys.argv[1], encoding="utf-8"))
          assert schema["database"]["version"] == 1
          assert len(schema["database"]["entities"]) == 15
          print(f"ROOM_SCHEMA_PASS version=1 entities={len(schema['database']['entities'])}")
          PY
          sha256sum "$APK"
          stat --format='APK_SIZE_BYTES=%s' "$APK"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke launch on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/smoke_launch_android.sh

      - name: Upload installable APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Navigator-Dosuga-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android 16 smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Navigator-Dosuga-Android-Smoke-Logs
          path: app/build/outputs/apk/debug/android-16-smoke-logcat.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android 16 UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Navigator-Dosuga-Android-16-Screenshot
          path: app/build/outputs/apk/debug/android-16-main.png
          if-no-files-found: warn
          retention-days: 14
